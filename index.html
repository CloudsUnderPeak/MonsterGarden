<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dae7c0">
  <title>Monster Garden · 小怪物的日常</title>
  <link rel="stylesheet" href="assets/styles/app.css">
  <!-- Classic deferred scripts keep file:// support without a build step. -->
  <script src="src/config/scenes.js" defer></script>
  <script src="src/config/monsters.js" defer></script>
  <script src="src/assets/resource-loader.js" defer></script>
  <script src="src/assets/image-loader.js" defer></script>
  <script src="src/creatures/simulation.js" defer></script>
  <script src="src/scenes/scene-renderer.js" defer></script>
  <script src="src/rendering/creature-renderer.js" defer></script>
  <script src="src/rendering/world-renderer.js" defer></script>
  <script src="src/ui/scene-selector.js" defer></script>
  <script src="src/ui/creature-drag.js" defer></script>
  <script src="src/main.js" defer></script>
</head>
<body>
  <main class="terrarium" aria-label="小怪物生態箱">
    <canvas id="world" aria-label="小怪物在微風草原自由活動，按住怪物可拿起拖曳，點擊地面可吸引牠們靠近"></canvas>
    <div class="scene-control">
      <button id="redistribute" class="redistribute" type="button" title="重新分布怪物位置" aria-label="重新分布怪物位置" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 17.9 17"/></svg>
      </button>
      <div class="scene-select">
        <label class="visually-hidden" for="scene-select">選擇場所</label>
        <select id="scene-select"></select>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
      </div>
    </div>
    <p id="asset-status" class="asset-status" role="status" hidden></p>
    <footer class="credits" aria-label="製作名單">
      <p>繪師: <a href="https://www.twitch.tv/yurilin44" target="_blank" rel="noopener noreferrer">林攸禮</a></p>
      <p>程式: <a href="https://github.com/CloudsUnderPeak/MonsterGarden" target="_blank" rel="noopener noreferrer">雲在山之下</a></p>
    </footer>
  </main>
</body>
</html>
